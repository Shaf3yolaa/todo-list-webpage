{% extends "layout.html" %}
{% block content %}
<div class="card p-4">
    <h2 class="mb-4">Register</h2>
    <form action="/register" method="POST">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <div class="input-group">
                <input type="password" name="password" id="registerPassword" class="form-control" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('registerPassword', this)">Show</button>
            </div>
        </div>
        <div class="mb-3">
            <label>Confirm Password</label>
            <div class="input-group">
                <input type="password" name="confirm_password" id="registerConfirmPassword" class="form-control" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('registerConfirmPassword', this)">Show</button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <div class="mt-3 text-center">
        <a href="/login">Already have an account? Log in</a>
    </div>
</div>
{% endblock %}
